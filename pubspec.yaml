name: recora
description: "KidneyCare — a longitudinal medical history vault for dialysis caregivers."
publish_to: 'none'
version: 0.6.0+6

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.3

  # Navigation
  go_router: ^17.2.5

  # Local database (encrypted with SQLCipher)
  drift: ^2.28.2
  sqlite3: ^2.9.0
  sqlcipher_flutter_libs: ^0.6.5
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  path: ^1.9.1

  # Networking
  dio: ^5.9.0

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # UI
  google_fonts: ^6.3.2
  fl_chart: ^1.1.1

  # Capture
  image_picker: ^1.2.1
  crop_your_image: ^2.0.0

  # Utilities
  intl: ^0.20.2
  collection: ^1.19.1
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  share_plus: ^10.1.4

  # Reminders
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Doctor-visit summary
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.4
  freezed: ^3.2.4
  json_serializable: ^6.11.1
  drift_dev: ^2.28.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon_ios.png
  adaptive_icon_background: "#7C5CFC"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F4F5F8"
  color_dark: "#0D1113"
  image: assets/branding/splash_light.png
  image_dark: assets/branding/splash_dark.png
  android_12:
    color: "#F4F5F8"
    color_dark: "#0D1113"
    image: assets/branding/splash_light.png
    image_dark: assets/branding/splash_dark.png
